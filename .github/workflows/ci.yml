name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The gitleaks CLI is MIT licensed and free. The gitleaks-action wrapper is not:
      # it refuses to run for an organization without a paid licence key. Invoking the
      # binary directly gives the same scan with no licence and no third-party action
      # holding a token.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf "$url" | tar -xz gitleaks
          ./gitleaks version
      - name: Scan working tree and full history
        run: |
          ./gitleaks dir . --redact --no-banner --exit-code 1
          ./gitleaks git . --redact --no-banner --exit-code 1

  deployment-leak:
    name: No deployment-specific values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # This repo is public. Nothing tying it to one person's home server may land in it.
      # Checked as a literal grep rather than a linter rule so it cannot be silently disabled.
      - name: Grep for deployment fingerprints
        run: |
          set -o pipefail
          # Matches deployment-specific values, not contributor names: a GitHub handle in
          # NOTICE is deliberate attribution, whereas codeine.cloud or /home/codeine is a
          # path off one person's machine. This file is excluded because it necessarily
          # contains the patterns it searches for.
          patterns='duckdns\.org|cfargotunnel|codeine\.cloud|/home/[a-z]+/(Weave|Dev_Weave)|89\.6\.[0-9]|47\.62\.[0-9]|weave-turn|n8n\.'
          if grep -rniE "$patterns"                --exclude-dir=.git --exclude-dir=node_modules                --exclude='ci.yml' . ; then
            echo "::error::Deployment-specific value found. See CONTRIBUTING.md 'Never commit'."
            exit 1
          fi
          echo "clean"

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              bad=1
            fi
          done < <(git rev-list "$base..$head")
          exit $bad

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The installer runs as root on someone else's machine. An unquoted variable here
      # is a different class of bug from one in application code.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning install.sh uninstall.sh scripts/*.sh
      - name: systemd unit is parseable
        run: |
          sudo cp deploy/weave.service /etc/systemd/system/weave.service
          sudo systemd-analyze verify /etc/systemd/system/weave.service 2>&1 | tee verify.log
          # Missing ExecStart target is expected here — nothing is installed on a runner.
          if grep -viE 'command .* is not executable|No such file or directory' verify.log | grep -qiE 'error|failed'; then
            echo "::error::systemd rejected the unit"; exit 1
          fi
          sudo rm -f /etc/systemd/system/weave.service

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # npm ci needs the lockfile committed — see CONTRIBUTING.md.
      - run: npm ci
      - run: npm test
